<title>اسکیم چیک | Scheme Check</title>
<meta name="theme-color" content="#0e6b52">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Gulzar&display=swap">
<style>
  /* Layout: one narrow column of numbered question cards; results stack below, then the bank question and red flags. Always light. */
  :root {
    --bg: #f6f3ee; --card: #ffffff; --ink: #1d232b; --muted: #5c646d; --line: #e3ddd2;
    --accent: #0e6b52; --accent-ink: #ffffff; --accent-soft: #e3f2ec;
    --bad: #b42318; --bad-bg: #fdecea; --warn: #8a5a00; --warn-bg: #fff3d6; --good: #0e6b52; --good-bg: #e5f3ee;
    --chip: #f1ede6; --focus: #f0a400; --wa: #1a7f45; --wa-ink: #ffffff; --tank: #cfe7dd;
    --font-ur: 'Gulzar', 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', 'Urdu Typesetting', 'Noto Naskh Arabic', serif;
    --font-en: 'Atkinson Hyperlegible', 'Segoe UI', Roboto, system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-en); }

  .wrap { max-width: 552px; margin: 0 auto; padding-block: 12px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .wrap[lang="ur"] { font-family: var(--font-ur); font-size: 21px; line-height: 2.3; font-synthesis: none; --lh-ctl: 2.1; --title: 36px; }
  .wrap[lang="en"] { font-family: var(--font-en); font-size: 18px; line-height: 1.55; --lh-ctl: 1.35; --title: 28px; }

  header { display: grid; gap: 2px; padding: 4px 0; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: var(--title); margin: 0; line-height: 1.6; color: var(--accent); }
  .wrap[lang="ur"] h1 { font-weight: 400; }
  .tag { margin: 0; color: var(--muted); font-size: 0.86em; }

  .lang { display: inline-flex; border: 2px solid var(--accent); border-radius: 99px; overflow: hidden; }
  .lang button { font-size: 16px; line-height: 1.6; padding: 4px 14px; min-height: 40px; border: 0; background: var(--card); color: var(--accent); cursor: pointer; }
  .lang button[lang="ur"] { font-family: var(--font-ur); font-size: 18px; line-height: 1.9; padding-block: 0; }
  .lang button[lang="en"] { font-family: var(--font-en); font-weight: 700; }
  .lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  .mode { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 2px solid var(--accent); border-radius: 14px; overflow: hidden; margin-top: 10px; }
  .mode button { font: inherit; font-size: 0.8em; line-height: var(--lh-ctl); padding: 8px 6px; min-height: 52px; border: 0; background: var(--card); color: var(--accent); cursor: pointer; }
  .mode button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .wrap[lang="en"] .mode button { font-weight: 700; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 14px; margin: 12px 0; }
  .q { display: block; font-size: 1.04em; margin: 0 0 4px; }
  .wrap[lang="en"] .q { font-weight: 700; }
  .n { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 700 16px/1 var(--font-en); margin-inline-end: 8px; vertical-align: middle; }
  .hint { color: var(--muted); font-size: 0.8em; margin: 0; }
  .field { position: relative; margin-top: 4px; }
  input[type=text] {
    width: 100%; font: 400 24px/1.4 var(--font-en); padding: 10px 14px; border: 2px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--ink); direction: ltr; text-align: left;
  }
  input[type=text]:focus { outline: none; border-color: var(--focus); }
  .unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 18px; line-height: 1; pointer-events: none; }
  .wrap[lang="ur"] .unit { font-family: var(--font-ur); font-size: 20px; line-height: 2; }
  .words { min-height: 1.6em; color: var(--accent); font-size: 0.84em; margin-top: 2px; }
  .words:empty { min-height: 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chips.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .chip {
    font: inherit; font-size: 0.8em; line-height: var(--lh-ctl); padding: 4px 10px; min-height: 48px;
    border: 2px solid var(--line); border-radius: 10px; background: var(--chip); color: var(--ink); cursor: pointer;
  }
  .chip small { display: block; font-size: 0.72em; color: var(--muted); line-height: 1.5; }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .wrap[lang="en"] .chip[aria-pressed="true"] { font-weight: 700; }
  .chip:disabled { opacity: .35; cursor: not-allowed; }
  .seg { display: inline-flex; gap: 0; margin-top: 6px; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg .chip { border: 0; border-radius: 0; min-height: 40px; padding-inline: 16px; }
  button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .types { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
  .type {
    display: grid; justify-items: center; align-content: start; gap: 2px; padding: 8px 4px; min-height: 104px; text-align: center;
    border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); cursor: pointer; font: inherit;
  }
  .type svg, .tank svg { direction: ltr; }
  .type svg { width: 34px; height: 34px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .type svg .fill { fill: var(--accent); stroke: none; }
  .type .tn { font-size: 0.72em; line-height: 1.7; }
  .type .ts { font-size: 0.6em; line-height: 1.6; color: var(--muted); }
  .wrap[lang="en"] .type .tn { font-weight: 700; line-height: 1.3; }
  .wrap[lang="en"] .type .ts { line-height: 1.3; }
  .type[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

  details { margin-top: 4px; }
  summary { cursor: pointer; color: var(--accent); font-size: 0.86em; padding: 4px 0; }
  .wrap[lang="en"] summary { font-weight: 700; }
  .go {
    width: 100%; font: inherit; font-size: 1.15em; line-height: var(--lh-ctl); padding: 10px; margin-top: 6px;
    border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  .wrap[lang="en"] .go { font-weight: 700; }
  .err { color: var(--bad); font-size: 0.8em; margin: 6px 0 0; }
  .err:empty { display: none; }

  #result { scroll-margin-top: 10px; }
  .example { display: inline-block; font-size: 0.7em; line-height: 2; padding: 0 12px; border-radius: 99px; background: var(--chip); color: var(--muted); margin-top: 6px; }
  .line { border-radius: 14px; padding: 12px 14px; margin: 12px 0; border: 2px solid transparent; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; align-items: start; }
  .line .ln { grid-row: span 2; margin-top: 0.35em; }
  .line p { margin: 0; font-size: 1.04em; }
  .line .sub { font-size: 0.78em; color: var(--muted); margin-top: 4px; }
  .line .sub:empty { display: none; }
  .wrap[lang="en"] .big { font-weight: 700; }
  .wrap[lang="ur"] .big { font-size: 1.06em; }
  .l1 { background: var(--bad-bg); border-color: var(--bad); } .l1 .big { color: var(--bad); }
  .l2 { background: var(--warn-bg); border-color: var(--warn); } .l2 .big { color: var(--warn); }
  .l3 { background: var(--good-bg); border-color: var(--good); } .l3 .big { color: var(--good); }
  .ln { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; font: 700 16px/1 var(--font-en); color: var(--card); }
  .l1 .ln { background: var(--bad); } .l2 .ln { background: var(--warn); } .l3 .ln { background: var(--good); }

  .tank h2 { font-size: 0.9em; margin: 0; font-weight: 400; }
  .wrap[lang="en"] .tank h2 { font-weight: 700; }
  .tank svg { display: block; width: 100%; height: auto; margin-top: 4px; touch-action: pan-y; }
  .tank text { font-family: inherit; font-size: 13px; fill: var(--muted); }
  .tank .tk-area { fill: var(--tank); }
  .tank .tk-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  .tank .tk-base { stroke: var(--line); stroke-width: 1; }
  .tank .tk-today { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 3 3; }
  .tank .tk-today-label { fill: var(--ink); font-size: 14px; }
  .tank .tk-end { fill: var(--bad); stroke: var(--card); stroke-width: 2; }
  .tank .tk-end-label { fill: var(--bad); font-size: 14px; }
  .tank .tk-hover { stroke: var(--muted); stroke-width: 1; }
  .tank .tk-dot { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
  .tank .tip { font-size: 0.74em; color: var(--muted); margin: 2px 0 0; min-height: 1.8em; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .btn {
    font: inherit; font-size: 0.86em; line-height: var(--lh-ctl); padding: 8px 10px; min-height: 52px; border-radius: 12px; cursor: pointer;
    border: 2px solid var(--accent); background: var(--card); color: var(--accent);
    display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; text-decoration: none;
  }
  .btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .wrap[lang="en"] .btn { font-weight: 700; }
  .btn.wa { background: var(--wa); border-color: var(--wa); color: var(--wa-ink); width: 100%; margin-top: 12px; }
  .why, .note { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; margin-top: 10px; font-size: 0.9em; }
  .note { font-size: 0.78em; color: var(--muted); }
  .qr { display: grid; place-items: center; margin: 10px 0 6px; }
  .qr img { width: 180px; height: 180px; background: #ffffff; border-radius: 8px; }
  .url { margin: 0 0 8px; text-align: center; font: 15px/1.5 var(--font-en); overflow-wrap: anywhere; direction: ltr; }
  .url a { color: var(--accent); }
  .copy-note { font-size: 0.74em; color: var(--muted); text-align: center; margin: 6px 0 0; }
  .copy-note:empty { display: none; }

  .bankq { border: 2px solid var(--good); }
  .banks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
  .bank {
    display: grid; justify-items: center; gap: 4px; padding: 10px 4px 6px; min-height: 104px;
    border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); cursor: pointer; font: inherit;
  }
  .bank[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .logo {
    width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; overflow: hidden;
    background: var(--chip); color: var(--accent); font: 700 15px/1 var(--font-en); letter-spacing: 0.04em; border: 1px solid var(--line);
  }
  .logo.has-img { width: 100%; height: 44px; background: #ffffff; border-color: transparent; padding: 2px 4px; }
  .logo img { display: block; width: auto; height: auto; max-width: 100%; max-height: 38px; }
  .bname { font-size: 0.7em; line-height: 1.6; text-align: center; overflow-wrap: anywhere; }
  .wrap[lang="ur"] .bname { line-height: 1.9; }
  .sublabel { font-size: 0.76em; color: var(--muted); margin: 10px 0 0; }
  .rate-note { color: var(--muted); font-size: 0.78em; margin-top: 6px; }
  .rate-note:empty { display: none; }

  .flags { display: grid; gap: 10px; margin-top: 8px; }
  .flag { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .flag:last-child { border-bottom: 0; padding-bottom: 0; }
  .flag p { margin: 0; font-size: 0.8em; }
  .flag .seg { margin: 0; }
  .flag .chip { min-height: 44px; padding-inline: 14px; }
  .flag .chip[data-v="yes"][aria-pressed="true"] { background: var(--bad-bg); color: var(--bad); }
  .level { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; margin-top: 12px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); font-size: 0.86em; }
  .level svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .level[data-level="none"] { border-color: var(--good); background: var(--good-bg); color: var(--good); }
  .level[data-level="some"] { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }
  .level[data-level="high"] { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
  .level span { color: var(--ink); }

  .adv .row { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 8px; align-items: center; margin: 6px 0; direction: ltr; text-align: left; font: 14px/1.4 var(--font-en); }
  .adv input[type=text] { font-size: 18px; padding: 6px 10px; }
  .adv .detail { direction: ltr; text-align: left; font: 13px/1.5 Consolas, 'Courier New', monospace; color: var(--muted); white-space: pre-wrap; margin-top: 8px; overflow-wrap: anywhere; }
  .adv .detail:empty { display: none; }
  footer { color: var(--muted); font-size: 0.7em; margin-top: 18px; display: grid; gap: 2px; }

  .hidden { display: none !important; }
  bdi { unicode-bidi: isolate; }
  @media (max-width: 360px) { .chips.grid, .banks, .types { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
<div class="wrap" id="app" dir="rtl" lang="ur">
  <header>
    <div class="top">
      <h1 data-t="title">اسکیم چیک</h1>
      <div class="lang" role="group" aria-label="Language / زبان">
        <button type="button" lang="ur" data-lang="ur" aria-pressed="true">اردو</button>
        <button type="button" lang="en" data-lang="en" aria-pressed="false">English</button>
      </div>
    </div>
    <p class="tag" data-t="tagline"></p>
    <div class="mode" id="modeChips" role="group">
      <button type="button" data-v="think" data-t="modeThink"></button>
      <button type="button" data-v="already" data-t="modeAlready"></button>
    </div>
  </header>

  <form id="form" novalidate>
    <div class="card">
      <div class="q"><span class="n">1</span><span data-t="qType"></span></div>
      <div class="types" id="typeTiles" role="group">
        <button type="button" class="type" data-v="double"><svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="13"/><text class="fill" x="17" y="22" text-anchor="middle" font-size="13" font-weight="700" font-family="Arial, sans-serif">×2</text></svg><span class="tn" data-t="tyDouble"></span><span class="ts" data-t="tyDoubleSub"></span></button>
        <button type="button" class="type" data-v="committee"><svg viewBox="0 0 34 34" aria-hidden="true"><circle class="fill" cx="17" cy="6" r="3.5"/><circle class="fill" cx="27.5" cy="13.6" r="3.5"/><circle class="fill" cx="23.5" cy="26" r="3.5"/><circle class="fill" cx="10.5" cy="26" r="3.5"/><circle class="fill" cx="6.5" cy="13.6" r="3.5"/><circle cx="17" cy="17" r="4"/></svg><span class="tn" data-t="tyCommittee"></span><span class="ts" data-t="tyCommitteeSub"></span></button>
        <button type="button" class="type" data-v="crypto"><svg viewBox="0 0 34 34" aria-hidden="true"><rect x="10" y="3" width="14" height="28" rx="3"/><path d="M15 27h4M17 20V10M13.5 13.5 17 10l3.5 3.5"/></svg><span class="tn" data-t="tyCrypto"></span><span class="ts" data-t="tyCryptoSub"></span></button>
        <button type="button" class="type" data-v="forex"><svg viewBox="0 0 34 34" aria-hidden="true"><path d="M4 29h26M5 23l7-8 6 5 7-11 5 4"/></svg><span class="tn" data-t="tyForex"></span><span class="ts" data-t="tyForexSub"></span></button>
        <button type="button" class="type" data-v="modaraba"><svg viewBox="0 0 34 34" aria-hidden="true"><rect x="5" y="11" width="24" height="17" rx="2"/><path d="M13 11V7h8v4M5 18h24"/></svg><span class="tn" data-t="tyModaraba"></span><span class="ts" data-t="tyModarabaSub"></span></button>
        <button type="button" class="type" data-v="other"><svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="13"/><path d="M13 13.5a4 4 0 1 1 5.5 3.7c-1 .5-1.5 1.2-1.5 2.3v.8"/><circle class="fill" cx="17" cy="24.5" r="1.5"/></svg><span class="tn" data-t="tyOther"></span><span class="ts" data-t="tyOtherSub"></span></button>
      </div>
      <p class="hint" data-t="typeHint" style="margin-top:6px"></p>
    </div>

    <div class="card">
      <label class="q" for="amount"><span class="n">2</span><span id="amountLabel"></span></label>
      <div class="field">
        <input type="text" id="amount" inputmode="numeric" autocomplete="off" placeholder="100000">
        <span class="unit" data-t="rs"></span>
      </div>
      <div class="words" id="amountWords" aria-live="polite"></div>
      <div class="chips" id="amountChips">
        <button type="button" class="chip" data-v="10000" data-t="a10k"></button>
        <button type="button" class="chip" data-v="50000" data-t="a50k"></button>
        <button type="button" class="chip" data-v="100000" data-t="a1l"></button>
        <button type="button" class="chip" data-v="500000" data-t="a5l"></button>
      </div>
    </div>

    <div class="card">
      <div class="q"><span class="n">3</span><span data-t="qFreq"></span></div>
      <div class="chips grid" id="freqChips" role="group">
        <button type="button" class="chip" data-v="daily" data-t="fDaily"></button>
        <button type="button" class="chip" data-v="weekly" data-t="fWeekly"></button>
        <button type="button" class="chip" data-v="monthly" data-t="fMonthly"></button>
        <button type="button" class="chip" data-v="quarterly" data-t="fQuarterly"></button>
        <button type="button" class="chip" data-v="yearly" data-t="fYearly"></button>
        <button type="button" class="chip" data-v="lump"><span data-t="fLump"></span><small data-t="fLumpSub"></small></button>
      </div>
    </div>

    <div class="card">
      <label class="q" for="rate"><span class="n">4</span><span id="rateLabel"></span></label>
      <div class="seg" id="rateUnitChips" role="group">
        <button type="button" class="chip" data-v="pct" data-t="unitPct"></button>
        <button type="button" class="chip" data-v="rs" data-t="unitRs"></button>
      </div>
      <div class="field">
        <input type="text" id="rate" inputmode="decimal" autocomplete="off" placeholder="10">
        <span class="unit" id="rateUnit"></span>
      </div>
      <div class="words" id="rateWords" aria-live="polite"></div>
      <p class="hint" id="rateHint"></p>
      <div class="chips hidden" id="lumpChips">
        <button type="button" class="chip" data-v="2" data-t="lumpDouble"></button>
        <button type="button" class="chip" data-v="3" data-t="lumpTriple"></button>
      </div>
      <div id="periodBox" class="hidden">
        <label class="q" for="period" style="margin-top:10px" data-t="qPeriod"></label>
        <div class="field"><input type="text" id="period" inputmode="numeric" autocomplete="off" placeholder="70"></div>
        <div class="chips" id="unitChips">
          <button type="button" class="chip" data-v="days" data-t="uDays"></button>
          <button type="button" class="chip" data-v="months" data-t="uMonths"></button>
        </div>
      </div>
    </div>

    <div class="card hidden" id="alreadyBox">
      <label class="q" for="ago"><span class="n">5</span><span data-t="qAgo"></span></label>
      <div class="field"><input type="text" id="ago" inputmode="numeric" autocomplete="off" placeholder="4"><span class="unit" data-t="uMonths"></span></div>
      <label class="q" for="got" style="margin-top:10px" data-t="qGot"></label>
      <div class="field"><input type="text" id="got" inputmode="numeric" autocomplete="off" placeholder="40000"><span class="unit" data-t="rs"></span></div>
      <p class="hint" data-t="gotHint"></p>
    </div>

    <div class="card">
      <details id="ageBox">
        <summary data-t="qAge"></summary>
        <div class="field"><input type="text" id="age" inputmode="numeric" autocomplete="off" placeholder="12"><span class="unit" data-t="uMonths"></span></div>
        <p class="hint" data-t="ageHint"></p>
      </details>
    </div>

    <button type="submit" class="go" data-t="calc"></button>
    <p class="err" id="err" role="alert"></p>
  </form>

  <section id="result" class="hidden" aria-live="polite">
    <span class="example hidden" id="exampleTag" data-t="example"></span>
    <div class="line l1"><span class="ln">1</span><p id="l1"></p><p class="sub" id="l1s"></p></div>
    <div class="line l2" id="l2box"><span class="ln">2</span><p id="l2"></p><p class="sub" id="l2s"></p></div>

    <figure class="card tank" id="tank" style="margin-inline:0">
      <h2 data-t="chartTitle"></h2>

<script>
/*
 * formula.js: Ponzi-scheme collapse ledger.
 *
 * Pure functions, no DOM, no network: the same file runs inside the offline
 * calculator page and in Node for checks (node check.js).
 *
 * Money inside the simulation is measured in units of the scheme's starting
 * money (seed = 1), so the collapse month does not depend on how big the
 * scheme really is. The family's rupee amount only scales their own outcome.
 */
(function (root) {
  'use strict';

  // Placeholder defaults. Calibrate against real collapsed schemes before release.
  var DEFAULTS = {
    g: 0.30,           // recruitment growth per month while the market is still empty
    M: 1000,           // market size: the most outside money the scheme can ever raise, in seed units
    k: 0.10,           // operators' cut of every new deposit
    q: 0,              // share of each payout members roll back in instead of taking cash
    secpMultiple: 1.5, // promised return at or below this multiple of the bank rate: no date, "check SECP"
    horizon: 600       // months to simulate before giving up (50 years)
  };

  // Scheme types. Each overrides the defaults above because recruitment differs by
  // type: an app spreads faster than a neighbourhood committee, and doubling schemes
  // run on people re-investing. preset = typical promise, used to fill the form.
  // Only `double` is anchored to a real case (Double Shah: doubling in ~70 days, ran
  // ~2 years); the others are placeholder judgements until calibrated.
  var TYPES = {
    other:     { params: {} },
    double:    { params: { g: 0.8, M: 100000, q: 0.5 }, preset: { freq: 'lump', rate: 1.0, period: 70, unit: 'days' } },
    committee: { params: { g: 0.4, M: 300, q: 0.3 }, preset: { freq: 'lump', rate: 1.0, period: 6, unit: 'months' } },
    crypto:    { params: { g: 0.7, M: 3000, k: 0.2, q: 0.6 }, preset: { freq: 'daily', rate: 0.02 } },
    forex:     { params: { g: 0.35, M: 3000, q: 0.3 }, preset: { freq: 'monthly', rate: 0.10 } },
    modaraba:  { params: { g: 0.25, M: 3000, q: 0.6 }, preset: { freq: 'monthly', rate: 0.05 } }
  };
  function typeParams(type) {
    var t = TYPES[type] || TYPES.other, p = {};
    for (var key in DEFAULTS) p[key] = key in t.params ? t.params[key] : DEFAULTS[key];
    return p;
  }

  var DAYS_PER_MONTH = 365 / 12;
  var WEEKS_PER_MONTH = 365 / 7 / 12;

  function withDefaults(params) {
    var p = {};
    for (var key in DEFAULTS) p[key] = DEFAULTS[key];
    if (params) for (key in params) if (params[key] != null) p[key] = params[key];
    return p;
  }

  // What the user typed -> a payout schedule the ledger understands.
  //   rate: promised return per period as a fraction (0.05 = 5%).
  //         For 'lump', the total gain at the end (1 = money doubles).
  //   freq: 'daily' | 'weekly' | 'monthly' | 'quarterly' | 'yearly' | 'lump'
  //   lumpMonths: 'lump' only, months until the single payout.
  // A schedule pays `pay` x balance every `every` months; a lump schedule pays
  // once (principal included) and the deposit is finished.
  // Daily and weekly payouts are summed into one monthly payment because the
  // ledger steps a month at a time.
  function toSchedule(rate, freq, lumpMonths) {
    switch (freq) {
      case 'daily':     return { lump: false, every: 1,  pay: rate * DAYS_PER_MONTH };
      case 'weekly':    return { lump: false, every: 1,  pay: rate * WEEKS_PER_MONTH };
      case 'monthly':   return { lump: false, every: 1,  pay: rate };
      case 'quarterly': return { lump: false, every: 3,  pay: rate };
      case 'yearly':    return { lump: false, every: 12, pay: rate };
      // A payout after 70 days lands in month 3, so round up.
      case 'lump':      return { lump: true,  every: Math.max(1, Math.ceil(lumpMonths - 1e-9)), pay: 1 + rate };
    }
    throw new Error('Unknown payout frequency: ' + freq);
  }

  // Promised return as a monthly rate, for comparing with a bank.
  function monthlyRate(s) {
    return s.lump ? Math.pow(s.pay, 1 / s.every) - 1 : s.pay / s.every;
  }

  // What a balance that started (or last matured) in month `start` is owed in month t.
  function owed(s, balance, start, t) {
    var age = t - start;
    if (age <= 0 || age % s.every !== 0) return 0;
    if (s.lump && age !== s.every) return 0;
    return balance * s.pay;
  }

  // Run the scheme month by month until the cash pool cannot cover what is owed.
  // One record per depositor cohort (everyone who joined in the same month).
  function simulate(s, params) {
    var p = withDefaults(params);
    var start = [0];    // month the cohort's current balance started earning
    var balance = [1];  // money of theirs the scheme owes returns on
    var putIn = [1];    // outside money the cohort brought in
    var paid = [0];     // cash the cohort has been paid so far
    var raised = 1;     // cumulative outside money, E
    var pool = 1 - p.k; // cash on hand
    var ledger = [{ month: 0, newMoney: 1, raised: 1, due: 0, pool: pool }];
    var due, dueBy = [], fresh, i, t;

    for (t = 1; t <= p.horizon; t++) {
      // 1. Recruitment: logistic in money raised so far.
      fresh = p.g * raised * (1 - raised / p.M);
      if (fresh < 0) fresh = 0;
      raised += fresh;
      pool += (1 - p.k) * fresh;
      start.push(t); balance.push(fresh); putIn.push(fresh); paid.push(0);

      // 2. Dues: everything falling due this month, in cash.
      due = 0;
      for (i = 0; i < start.length; i++) {
        dueBy[i] = owed(s, balance[i], start[i], t);
        due += dueBy[i];
      }
      due *= 1 - p.q;
      ledger.push({ month: t, newMoney: fresh, raised: raised, due: due, pool: pool });

      // 3. Collapse test. Whatever is left in the pool is assumed gone with the operators.
      if (pool < due) return finish(true, t);

      // 4. Pay out; rolled-back money stays in the scheme and keeps earning.
      pool -= due;
      for (i = 0; i < start.length; i++) {
        if (!dueBy[i]) continue;
        paid[i] += (1 - p.q) * dueBy[i];
        if (s.lump) { start[i] = t; balance[i] = p.q * dueBy[i]; }
        else balance[i] += p.q * dueBy[i];
      }
    }
    return finish(false, p.horizon);

    function finish(collapsed, C) {
      var totalIn = 0, totalPaid = 0, lost = 0, behind = 0, half = raised / 2, J = 0;
      for (var j = 0; j < putIn.length; j++) {
        totalIn += putIn[j];
        totalPaid += paid[j];
        if (putIn[j] > paid[j]) { lost += putIn[j] - paid[j]; behind += putIn[j]; }
      }
      while (ledger[J].raised < half) J++;
      return {
        collapsed: collapsed,
        collapseMonth: C,            // months after the scheme started
        raised: raised,              // total outside money ever taken in, seed units
        paidOut: totalPaid,
        operatorKeep: p.k * raised + pool, // their cut plus the pool they walk away with
        lossShare: lost / totalIn,   // share of all money put in that never comes back
        behindShare: behind / totalIn, // share of all money whose owners end up with less than they put in
        typicalJoinMonth: J,         // month half of all the money had come in
        ledger: ledger
      };
    }
  }

  // One family's outcome: they put in `amount` in month `joinMonth` and take every payout as cash.
  function family(s, sim, amount, joinMonth, bankAnnual) {
    var C = sim.collapseMonth, received = 0;
    for (var t = joinMonth + s.every; t < C; t += s.every) {
      received += amount * s.pay;
      if (s.lump) break;
    }
    var monthsLeft = Math.max(0, C - joinMonth);
    return {
      joinMonth: joinMonth,
      monthsLeft: monthsLeft,
      received: received,
      loss: Math.max(0, amount - received),
      bankProfit: amount * bankAnnual * monthsLeft / 12
    };
  }

  // A family that is already in: they joined in `joinMonth` and it is now `nowMonth`.
  // Splits the promised payouts into those due by now and those still to come before collapse.
  function invested(s, sim, amount, joinMonth, nowMonth) {
    var C = sim.collapseMonth, soFar = 0, ahead = 0;
    for (var t = joinMonth + s.every; t < C; t += s.every) {
      if (t <= nowMonth) soFar += amount * s.pay; else ahead += amount * s.pay;
      if (s.lump) break;
    }
    return {
      joinMonth: joinMonth,
      nowMonth: nowMonth,
      monthsLeft: Math.max(0, C - nowMonth),
      receivedSoFar: soFar,
      stillToCome: ahead
    };
  }

  // Everything the calculator needs for its three lines.
  //   input: { amount, rate, freq, lumpMonths, bankAnnual,
  //            schemeAgeMonths (optional), monthsAgo (optional: already invested that long ago) }
  function analyse(input, params) {
    var p = withDefaults(params);
    var s = toSchedule(input.rate, input.freq, input.lumpMonths);
    if (monthlyRate(s) <= p.secpMultiple * input.bankAnnual / 12) {
      return { verdict: 'check-secp', schedule: s };
    }
    var sim = simulate(s, p);
    if (!sim.collapsed) return { verdict: 'check-secp', schedule: s, sim: sim };

    var known = input.schemeAgeMonths != null;
    if (input.monthsAgo != null) {
      // Already in: "now" is the scheme's age if known, else the typical joiner's month plus the time since.
      var now = known ? input.schemeAgeMonths : sim.typicalJoinMonth + input.monthsAgo;
      var held = invested(s, sim, input.amount, Math.max(0, now - input.monthsAgo), now);
      return { verdict: now >= sim.collapseMonth ? 'overdue' : 'collapse', schedule: s, sim: sim, ageKnown: known, invested: held };
    }
    var join = known ? input.schemeAgeMonths : sim.typicalJoinMonth;
    if (join >= sim.collapseMonth) return { verdict: 'overdue', schedule: s, sim: sim };

    return {
      verdict: 'collapse',
      schedule: s,
      sim: sim,
      ageKnown: known,
      family: family(s, sim, input.amount, join, input.bankAnnual)
    };
  }

  // Calendar month the money runs out, counted from `today`.
  function collapseDate(today, monthsLeft) {
    var d = new Date(today.getFullYear(), today.getMonth() + monthsLeft, 1);
    return { month: d.getMonth() + 1, year: d.getFullYear() };
  }

  var api = {
    DEFAULTS: DEFAULTS,
    TYPES: TYPES,
    typeParams: typeParams,
    invested: invested,
    toSchedule: toSchedule,
    monthlyRate: monthlyRate,
    simulate: simulate,
    family: family,
    analyse: analyse,
    collapseDate: collapseDate
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.ScamModel = api;
})(this);
</script>

  function L() { return T[state.lang]; }

  // ---------- helpers ----------
  function toNumber(s) {
    s = String(s || '')
      .replace(/[۰-۹]/g, function (d) { return d.charCodeAt(0) - 0x06F0; })
      .replace(/[٠-٩]/g, function (d) { return d.charCodeAt(0) - 0x0660; })
      .replace(/[٫،]/g, '.')
      .replace(/[^\d.]/g, '');
    var n = parseFloat(s);
    return isFinite(n) ? n : NaN;
  }
  function pressed(group, value) {
    Array.prototype.forEach.call($(group).querySelectorAll('[data-v]'), function (c) {
      c.setAttribute('aria-pressed', c.getAttribute('data-v') === value ? 'true' : 'false');
    });
  }
  function onChip(group, fn) {
    $(group).addEventListener('click', function (e) {
      var c = e.target.closest('[data-v]');
      if (c && !c.disabled) fn(c.getAttribute('data-v'), c);
    });
  }
  function load() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } }
  function bankById(id) { for (var i = 0; i < BANKS.list.length; i++) if (BANKS.list[i].id === id) return BANKS.list[i]; return null; }
  function bankName(bk) { return state.lang === 'ur' ? bk.ur : bk.en; }
  var INPUTS = ['amount', 'rate', 'period', 'age', 'ago', 'got'];

  function save() {
    var data = {
      lang: state.lang, mode: state.mode, scheme: state.scheme, freq: state.freq, unit: state.unit, rateUnit: state.rateUnit,
      bank: state.bank, type: state.type, tax: state.tax, adv: readAdv()
    };
    var old = load();
    INPUTS.forEach(function (k) {
      if (last && !last.example) { if ($(k).value) data[k] = $(k).value; }
      else if (old[k]) data[k] = old[k];
    });
    try { localStorage.setItem(STORE, JSON.stringify(data)); } catch (e) { /* storage blocked: fine */ }
  }

  // ---------- language ----------
  function setLang(lang) {
    state.lang = lang;
    app.setAttribute('lang', lang);
    app.setAttribute('dir', lang === 'ur' ? 'rtl' : 'ltr');
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'ur' ? 'rtl' : 'ltr');
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) {
      el.textContent = L()[el.getAttribute('data-t')];
    });
    Array.prototype.forEach.call(document.querySelectorAll('.lang [data-lang]'), function (btn) {
      btn.setAttribute('aria-pressed', btn.getAttribute('data-lang') === lang ? 'true' : 'false');
    });
    var c = BANKS.checked.split('-');
    $('ratesDate').textContent = L().ratesDate(Number(c[2]), L().months[Number(c[1]) - 1], c[0], BANKS.policyRate);
    setMode(state.mode);
    setFreq(state.freq);
    buildBankGrid();
    buildFlags();
    showAmountWords();
    setListening(false);
    if (last) render();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.lang [data-lang]'), function (btn) {
    btn.addEventListener('click', function () { stopSpeaking(); setLang(btn.getAttribute('data-lang')); save(); });
  });

  // ---------- mode: thinking of investing / already invested ----------
  function setMode(mode) {
    state.mode = mode; pressed('modeChips', mode);
    $('amountLabel').textContent = mode === 'already' ? L().qAmountAlready : L().qAmount;
    $('bankLabel').textContent = mode === 'already' ? L().qBankAlready : L().qBank;

  function readAdv() {

      var v = toNumber($('adv-' + key).value);
      p[key] = isNaN(v) ? base[key] : v;
    });
    p.g = Math.min(Math.max(p.g, 0.01), 1);

  // ---------- calculate ----------
  function fail(key, field) {
    $('err').textContent = L()[key]; $('result').classList.add('hidden'); $('detail').textContent = '';
    if (field) $(field).focus();
  }

  function calculate(opts) {
    opts = opts || {};
    $('err').textContent = '';
    var amount = toNumber($('amount').value);
    if (!(amount > 0)) return opts.quiet || fail('errAmount', 'amount');
    if (!(toNumber($('rate').value) > 0)) return opts.quiet || fail('errRate', 'rate');
    var rate = rateFraction();
    if (!(rate > 0)) return opts.quiet || fail(state.rateUnit === 'rs' && state.freq === 'lump' ? 'errBack' : 'errRate', 'rate');
    var lumpMonths = null;
    if (state.freq === 'lump') {
      var n = toNumber($('period').value);
      if (!(n > 0)) return opts.quiet || fail('errPeriod', 'period');
      lumpMonths = state.unit === 'days' ? n / (365 / 12) : n;
    }
    var ageText = $('age').value.trim();
    var age = ageText ? Math.round(toNumber(ageText)) : null;
    if (ageText && !(age >= 0)) age = null;
    var ago = null, got = null;
    if (state.mode === 'already') {
      ago = Math.round(toNumber($('ago').value));
      if (!($('ago').value.trim() && ago >= 0)) return opts.quiet || fail('errAgo', 'ago');
      var gotText = $('got').value.trim();
      got = gotText ? toNumber(gotText) : null;
      if (got !== null && !(got >= 0)) got = null;
    }

    var params = readAdv();
    // The verdict uses the reference savings rate, so it doesn't change with the bank picked afterwards.
    var input = {
      amount: amount, rate: rate, freq: state.freq, lumpMonths: lumpMonths,
      bankAnnual: BANKS.reference / 100, schemeAgeMonths: age, monthsAgo: ago
    };
    last = { r: Model.analyse(input, params), input: input, params: params, example: !!opts.example, got: got };
    render();
    if (opts.scroll) $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (!opts.example) save();
  }

  function render() {
    var r = last.r, input = last.input, l = L(), inv = r.invested;
    var l1 = '', l1s = '', l2 = '', l2s = '', showL2 = true;
    var amt = l.money(input.amount);
    var tenths = r.sim ? tenthsOf(r.sim.behindShare) : 0;

    if (inv) {
      var est = last.got === null, rec = est ? inv.receivedSoFar : last.got, risk = Math.max(0, input.amount - rec);
      if (r.verdict === 'overdue') { l1 = l.overdueAlready1; l1s = l.overdueSub; }
      else {
        var d0 = Model.collapseDate(new Date(), inv.monthsLeft);
        l1 = l.l1(l.months[d0.month - 1] + ' ' + d0.year); l1s = l.l1s;
      }
      l2 = risk > 0 ? l.inv2(l.money(rec), l.money(risk), est) : l.inv2Back(l.money(rec), est);
      l2s = l.inv2s(tenths);
    } else if (r.verdict === 'collapse') {
      var f = r.family, d = Model.collapseDate(new Date(), f.monthsLeft);
      l1 = l.l1(l.months[d.month - 1] + ' ' + d.year);
      l1s = l.l1s;
      if (f.loss >= 0.95 * input.amount) l2 = l.l2All(amt);
      else if (f.loss > 0) l2 = l.l2Loss(amt, l.money(f.loss));
      else l2 = l.l2Gain(l.money(f.received));
      l2s = l.l2s(tenths);
    } else if (r.verdict === 'overdue') {
      l1 = l.overdue1; l1s = l.overdueSub; l2 = l.overdue2(amt);
    } else {
      l1 = l.secp1; l1s = l.secpSub; showL2 = false;
    }

    $('exampleTag').classList.toggle('hidden', !last.example);
    $('l1').innerHTML = l1; $('l1s').textContent = l1s;
    $('l2').innerHTML = l2; $('l2s').textContent = l2s;
    $('l2box').classList.toggle('hidden', !showL2);
    $('why').classList.add('hidden'); $('whyBtn').setAttribute('aria-expanded', 'false');
    $('whyBtn').classList.toggle('hidden', r.verdict === 'check-secp');
    $('voiceNote').classList.add('hidden');
    $('result').classList.remove('hidden');
    pressed('bankGrid', state.bank);
    renderChart();
    renderBank();
    renderLevel();
    updateShare();

    // Expert detail: the raw model numbers behind the lines.
    var s = r.schedule, p = last.params, lines = [
      'scheme type: ' + state.scheme + '  |  promise entered as ' + (state.rateUnit === 'rs' ? 'rupees' : 'percent'),
      'schedule: pay ' + (s.pay * 100).toFixed(2) + '% every ' + s.every + ' mo' + (s.lump ? ' (once)' : ''),
      'monthly-equivalent promise: ' + (Model.monthlyRate(s) * 100).toFixed(2) + '%  |  reference bank rate: ' + BANKS.reference + '%/yr',
      'g=' + p.g + '  M=' + p.M + '  k=' + p.k + '  q=' + p.q,
      'verdict: ' + r.verdict
    ];
    if (r.sim) lines.push('collapse month C=' + r.sim.collapseMonth + '  money lost ' + Math.round(r.sim.lossShare * 100) + '%  behind ' + Math.round(r.sim.behindShare * 100) + '%');
    if (r.family) lines.push('join J=' + r.family.joinMonth + (r.ageKnown ? ' (known age)' : ' (typical joiner)') + '  months left ' + r.family.monthsLeft + '  received ' + Math.round(r.family.received) + '  loss ' + Math.round(r.family.loss));
    if (inv) lines.push('already in: joined month ' + inv.joinMonth + ', now month ' + inv.nowMonth + ', due so far ' + Math.round(inv.receivedSoFar) + ', still promised ' + Math.round(inv.stillToCome));
    $('detail').textContent = lines.join('\n');
  }

  // ---------- money tank chart ----------
  function el(name, attrs, text) {
    var node = document.createElementNS(SVG, name);
    for (var k in attrs) node.setAttribute(k, attrs[k]);
    if (text != null) node.textContent = text;
    return node;
  }
  var chart = null;
  function renderChart() {
    var r = last.r, svg = $('tankSvg'), l = L();
    var show = !!r.sim && (r.verdict === 'collapse' || r.verdict === 'overdue');
    $('tank').classList.toggle('hidden', !show);
    chart = null;
    if (!show) return;
    var C = r.sim.collapseMonth, led = r.sim.ledger;
    var you = r.invested ? r.invested.nowMonth : r.family ? r.family.joinMonth : r.sim.typicalJoinMonth;
    if (r.verdict === 'overdue' && !r.invested) you = Math.max(C, last.input.schemeAgeMonths || C);
    var vals = [];
    for (var t = 0; t <= C; t++) vals.push(t < C ? Math.max(0, led[t].pool - led[t].due) : 0);
    var maxV = Math.max.apply(null, vals) || 1, end = Math.max(C, you, 1);
    var W = 320, H = 170, PL = 18, PR = 18, PT = 34, PB = 38, rtl = state.lang === 'ur';
    function x(m) { var v = PL + (W - PL - PR) * m / end; return rtl ? W - v : v; }
    function y(v) { return PT + (H - PT - PB) * (1 - v / maxV); }
    function anchorAt(px) { return px < 60 ? 'start' : px > W - 60 ? 'end' : 'middle'; }
    function when(m) { var d = Model.collapseDate(new Date(), m - you); return l.months[d.month - 1] + ' ' + d.year; }

    var path = vals.map(function (v, m) { return (m ? 'L' : 'M') + x(m).toFixed(1) + ' ' + y(v).toFixed(1); }).join(' ');
    var base = y(0);
    svg.textContent = '';
    svg.setAttribute('aria-label', l.chartAria(when(C)));
    svg.appendChild(el('path', { 'class': 'tk-area', d: path + ' L' + x(C).toFixed(1) + ' ' + base + ' L' + x(0).toFixed(1) + ' ' + base + ' Z' }));
    svg.appendChild(el('line', { 'class': 'tk-base', x1: x(0), x2: x(end), y1: base, y2: base }));
    svg.appendChild(el('path', { 'class': 'tk-line', d: path }));
    svg.appendChild(el('text', { x: x(0), y: base + 24, 'text-anchor': anchorAt(x(0)) }, l.chartStart));
    var hover = el('line', { 'class': 'tk-hover hidden', y1: PT - 4, y2: base });
    var dot = el('circle', { 'class': 'tk-dot hidden', r: 4 });
    svg.appendChild(hover); svg.appendChild(dot);
    svg.appendChild(el('line', { 'class': 'tk-today', x1: x(you), x2: x(you), y1: PT - 10, y2: base }));
    svg.appendChild(el('text', { 'class': 'tk-today-label', x: x(you), y: PT - 16, 'text-anchor': anchorAt(x(you)) }, l.chartToday));
    svg.appendChild(el('circle', { 'class': 'tk-end', cx: x(C), cy: base, r: 6 }));
    svg.appendChild(el('text', { 'class': 'tk-end-label', x: x(C), y: base + 24, 'text-anchor': anchorAt(x(C)) }, when(C)));
    $('tankTip').textContent = l.chartCaption;
    chart = { x: x, y: y, vals: vals, C: C, end: end, rtl: rtl, W: W, PL: PL, PR: PR, maxV: maxV, when: when, hover: hover, dot: dot };
  }
  function chartHover(e) {
    if (!chart) return;
    var svg = $('tankSvg'), box = svg.getBoundingClientRect();

    var frac = ((chart.rtl ? chart.W - px : px) - chart.PL) / (chart.W - chart.PL - chart.PR);
    var m = Math.round(Math.min(1, Math.max(0, frac)) * chart.end);

    var v = chart.vals[m];
    chart.hover.setAttribute('x1', chart.x(m)); chart.hover.setAttribute('x2', chart.x(m));

    chart.hover.classList.remove('hidden'); chart.dot.classList.remove('hidden');
    $('tankTip').textContent = L().chartTip(chart.when(m), Math.round(v / chart.maxV * 100));

  // ---------- start ----------
  var saved = load();

  // Hosted on the web, the page's link is what people share; saving a file is blocked there.
  if (document.querySelector('meta[name="claude:viewport-fit-sides"]')) $('shareCard').classList.add('hidden');

  // "Pass it on" card: QR code and public link, once the site exists.
  if (SITE && SITE.url) {
    $('linkCard').classList.remove('hidden');
    $('qrImg').src = SITE.qr;
    $('siteUrl').href = SITE.url;
    $('siteUrl').textContent = SITE.url.replace(/^https:\/\//, '');
    $('copyLink').addEventListener('click', function () {
      function note(key) { $('copyNote').textContent = L()[key]; }
      function select() {
        var range = document.createRange(), sel = window.getSelection();
        range.selectNodeContents($('siteUrl')); sel.removeAllRanges(); sel.addRange(range);
        note('copyFail');
      }
      try { navigator.clipboard.writeText(SITE.url).then(function () { note('copied'); }, select); } catch (e) { select(); }
    });
  }

  if (saved.amount) {
    calculate({ quiet: true });
  } else {
    // First open: a worked example so the page explains itself.
    $('amount').value = '100000'; $('rate').value = '10'; setFreq('monthly'); showAmountWords();
    calculate({ example: true });
  }
})();
</script>
